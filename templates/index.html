<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8">
    <link href="{{ url_for("static", filename= "style.css")}}" type="text/css" rel="stylesheet">
    <title> To-Do Liste als Webapplikation </title>
  </head>
<body>
    <h1> Meine To-Do Liste </h1>
    <form action="/add" method="POST">
      neue Aufgabe
      <input type="text" name="todo" placeholder="neue Aufgabe eingeben" required>
      <button id="button1" type="submit"> Hinzufügen </button>
    </form>

    <ul>
      {% for todo in todos %}
      <li>

        <form action="{{url_for("toggle_task", todo_id=todo.id)}}" method="POST">
          <input 
          type="checkbox"
          onchange="this.form.submit()"
          {%if todo.completed%} checked {%endif%}
          >
          <label for="task" class="todo-text"> Aufgabe erledigt </label>
        </form>

        <p class= "inline-text"> {{ todo.task }}</p>
        <p> <small>({{todo.created_at.strftime("erstellt am %d.%m.%y")}}) </small></p>

        <form action="/delete/{{todo.id}}" method="POST">
          <button id="button2" type="submit"> Löschen </button>
        </form>
      </li>
      {% endfor %}
    </ul>


</body>

</html>
